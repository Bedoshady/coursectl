[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eclass-api"
version = "0.1.0"
description = "A server-side API and MCP bridge for York University eClass (Moodle) with delegated, out-of-browser auth."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "cryptography>=42",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "mcp>=2.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
eclass = "eclass_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eclass_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
